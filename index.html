<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kenyang.in – Kantin Bougenville</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
</head>

<body class="bg-gray-100">

<!-- ========= LOGIN PAGE ========= -->
<div id="loginPage" class="min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-xl p-8 rounded-xl w-96">
    <h1 class="text-2xl font-bold text-center mb-6">kenyang.in</h1>

    <input id="email" type="email" class="w-full p-3 border rounded mb-3" placeholder="Email">
    <input id="password" type="password" class="w-full p-3 border rounded mb-3" placeholder="Password">

    <button onclick="login()" class="w-full bg-blue-600 text-white p-3 rounded hover:bg-blue-700">
      Login
    </button>

    <p class="mt-3 text-center text-sm">
      Belum punya akun?
      <a onclick="toggleRegister()" class="text-blue-600 cursor-pointer">Daftar</a>
    </p>
  </div>
</div>

<!-- ========= REGISTER PAGE ========= -->
<div id="registerPage" class="min-h-screen hidden flex items-center justify-center">
  <div class="bg-white shadow-xl p-8 rounded-xl w-96">

    <h1 class="text-2xl font-bold text-center mb-6">Daftar Akun</h1>

    <input id="regName" type="text" class="w-full p-3 border rounded mb-3" placeholder="Nama">
    <input id="regEmail" type="email" class="w-full p-3 border rounded mb-3" placeholder="Email">
    <input id="regPass" type="password" class="w-full p-3 border rounded mb-3" placeholder="Password">

    <select id="regRole" class="w-full p-3 border rounded mb-3">
      <option value="siswa">Siswa</option>
      <option value="penjual">Penjual</option>
    </select>

    <button onclick="register()" class="w-full bg-green-600 text-white p-3 rounded hover:bg-green-700">
      Daftar
    </button>

    <p class="mt-3 text-center text-sm">
      Sudah punya akun?
      <a onclick="toggleRegister()" class="text-blue-600 cursor-pointer">Login</a>
    </p>
  </div>
</div>

<!-- ========= DASHBOARD SISWA ========= -->
<div id="siswaPage" class="hidden p-6">
  <h1 class="text-xl font-bold mb-4">Menu Kantin Bougenville</h1>

  <div id="produkList" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>

  <h2 class="text-xl font-semibold mt-8 mb-2">Pesanan Saya</h2>
  <div id="pesananList" class="space-y-2"></div>

  <button onclick="logout()" class="fixed bottom-5 right-5 bg-red-600 text-white px-5 py-3 rounded-lg">
    Logout
  </button>
</div>

<!-- ========= DASHBOARD PENJUAL ========= -->
<div id="penjualPage" class="hidden p-6">
  <h1 class="text-xl font-bold mb-4">Dashboard Penjual</h1>

  <h2 class="font-semibold mb-2">Tambah Produk</h2>
  <input id="pName" placeholder="Nama Produk" class="p-2 border rounded w-full mb-2">
  <input id="pPrice" placeholder="Harga" class="p-2 border rounded w-full mb-2" type="number">

  <button onclick="addProduct()" class="bg-blue-600 text-white px-4 py-2 rounded">
    Tambah
  </button>

  <h2 class="font-semibold mt-6 mb-2">Daftar Produk</h2>
  <div id="penjualProdukList" class="space-y-2"></div>

  <h2 class="font-semibold mt-6 mb-2">Pesanan Masuk</h2>
  <div id="penjualPesananList" class="space-y-2"></div>

  <button onclick="logout()" class="fixed bottom-5 right-5 bg-red-600 text-white px-5 py-3 rounded-lg">
    Logout
  </button>
</div>

<script>
/* ---------------- FIREBASE INIT ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyDVwHXH2-DRYqeNb3YXPkTuyh3IapySobk",
  authDomain: "kenyangin.firebaseapp.com",
  projectId: "kenyangin",
  storageBucket: "kenyangin.firebasestorage.app",
  messagingSenderId: "184701436940",
  appId: "1:184701436940:web:1fab3e9826ec46fb0e5a29",
  measurementId: "G-7B45DL87Q6"
};

const app = firebase.initializeApp(firebaseConfig);
const auth = firebase.getAuth();
const db = firebase.getDatabase();

/* ---------------- PAGE STATE ---------------- */
function toggleRegister() {
  document.getElementById("loginPage").classList.toggle("hidden");
  document.getElementById("registerPage").classList.toggle("hidden");
}

/* ---------------- REGISTER ---------------- */
async function register() {
  const name = regName.value;
  const email = regEmail.value;
  const pass = regPass.value;
  const role = regRole.value;

  await firebase.createUserWithEmailAndPassword(auth, email, pass);
  const uid = auth.currentUser.uid;

  await firebase.set(firebase.ref(db, "users/" + uid), {
    name, email, role
  });

  alert("Akun berhasil dibuat!");
  toggleRegister();
}

/* ---------------- LOGIN ---------------- */
async function login() {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  await firebase.signInWithEmailAndPassword(auth, email, pass);

  loadUser();
}

async function loadUser() {
  const uid = auth.currentUser.uid;

  const s = (await firebase.get(firebase.ref(db, "users/" + uid))).val();

  loginPage.classList.add("hidden");
  registerPage.classList.add("hidden");

  if (s.role === "siswa") {
    siswaPage.classList.remove("hidden");
    loadProducts();
    loadMyOrders();
  } else {
    penjualPage.classList.remove("hidden");
    loadProductsPenjual();
    loadOrdersPenjual();
  }
}

/* ---------------- LOGOUT ---------------- */
function logout() {
  firebase.signOut(auth);
  location.reload();
}

/* ---------------- SISWA: LOAD PRODUK ---------------- */
function loadProducts() {
  firebase.onValue(firebase.ref(db, "products"), (snap) => {
    const data = snap.val() || {};
    produkList.innerHTML = "";

    Object.entries(data).forEach(([id, p]) => {
      produkList.innerHTML += `
        <div class="bg-white p-4 rounded shadow">
          <h3 class="font-semibold">${p.name}</h3>
          <p>Rp ${p.price}</p>
          <button onclick="order('${id}', '${p.name}', ${p.price})"
            class="mt-2 bg-green-600 text-white px-3 py-1 rounded">
            Pesan
          </button>
        </div>
      `;
    });
  });
}

/* ---------------- SISWA: PESAN PRODUK ---------------- */
function order(pid, name, price) {
  const uid = auth.currentUser.uid;
  const oid = Date.now();

  firebase.set(firebase.ref(db, "orders/" + oid), {
    buyer: uid,
    name,
    price,
    time: new Date().toLocaleString()
  });

  alert("Pesanan dikirim!");
}

/* ---------------- SISWA: LOAD PESANAN ---------------- */
function loadMyOrders() {
  const uid = auth.currentUser.uid;

  firebase.onValue(firebase.ref(db, "orders"), (snap) => {
    const data = snap.val() || {};
    pesananList.innerHTML = "";

    Object.values(data)
      .filter(o => o.buyer === uid)
      .forEach(o => {
        pesananList.innerHTML += `
          <div class="bg-white p-3 rounded shadow">
            ${o.name} – Rp ${o.price}
            <p class="text-xs text-gray-500">${o.time}</p>
          </div>
        `;
      });
  });
}

/* ---------------- PENJUAL: ADD PRODUK ---------------- */
function addProduct() {
  const name = pName.value;
  const price = pPrice.value;
  const id = Date.now();

  firebase.set(firebase.ref(db, "products/" + id), {
    name, price
  });

  pName.value = "";
  pPrice.value = "";
}

/* ---------------- PENJUAL: LOAD PRODUK ---------------- */
function loadProductsPenjual() {
  firebase.onValue(firebase.ref(db, "products"), (snap) => {
    const data = snap.val() || {};
    penjualProdukList.innerHTML = "";

    Object.entries(data).forEach(([id, p]) => {
      penjualProdukList.innerHTML += `
        <div class="bg-white p-3 rounded shadow flex justify-between">
          <div>${p.name} – Rp ${p.price}</div>
          <button onclick="removeProduct('${id}')"
            class="text-red-600">Hapus</button>
        </div>
      `;
    });
  });
}

function removeProduct(id) {
  firebase.remove(firebase.ref(db, "products/" + id));
}

/* ---------------- PENJUAL: PESANAN MASUK ---------------- */
function loadOrdersPenjual() {
  firebase.onValue(firebase.ref(db, "orders"), (snap) => {
    const data = snap.val() || {};
    penjualPesananList.innerHTML = "";

    Object.values(data).forEach(o => {
      penjualPesananList.innerHTML += `
        <div class="bg-white p-3 rounded shadow">
          <strong>${o.name}</strong> – Rp ${o.price}
          <p class="text-xs text-gray-500">${o.time}</p>
        </div>
      `;
    });
  });
}

</script>
</body>
</html>
